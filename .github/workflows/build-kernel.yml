name: build-miro-kernel

on:
  # 内核已在 Linux 上编出来了，这里只保留手动触发，避免每次 push 白烧 macOS 额度
  workflow_dispatch:

jobs:
  kernel:
    # macOS runner: 这里要的就是 Xcode 自带的 cctools/mig/SDK —— Linux 上卡住的那几样
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode（要带 iPhoneOS 26 SDK 的那版）
        run: |
          echo "可用的 Xcode："
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          echo "当前："; xcodebuild -version; xcodebuild -showsdks | grep -iE "iphoneos" || true
          # 如果默认 Xcode 太旧、没有 iphoneos26，就切到最新的那个
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$LATEST" ] && sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: 下载 XNU 12377.121.6
        run: |
          curl -L --retry 3 -o /tmp/xnu.tar.gz \
            https://github.com/apple-oss-distributions/xnu/archive/refs/tags/xnu-12377.121.6.tar.gz
          mkdir -p xnu-src
          tar xzf /tmp/xnu.tar.gz -C xnu-src --strip-components=1

      - name: 打 dada 补丁 + 触摸固件头
        run: |
          cd xnu-src
          git init -q
          git add -A
          git -c user.email=ci@example.com -c user.name=ci commit -qm upstream
          git apply --whitespace=nowarn ../kernel/xnu-12377.121.6-dada.patch
          cp ../focaltech/redwood_focaltech_fw.h bsd/dev/
          echo "补丁已打"

      - name: 修 config 里的 /dev/null（kextsymboltool 需要可寻址的输出）
        run: |
          cd xnu-src
          sed -i '' 's|-output /dev/null|-output $(OBJPATH)/export-check.out|g' config/Makefile
          grep -n "export-check.out" config/Makefile | head -3

      - name: 准备依赖（macOS 走 Xcode 的 cctools/mig，不用 theos）
        env:
          XNU_SRC: ${{ github.workspace }}/xnu-src
          RC_DARWIN_KERNEL_VERSION: 12377.121.6
          XNU_ARCH: arm64e
          MACHINE: BCM2837
        run: |
          chmod +x xnu-deps/setup.sh xnu-build.sh
          bash xnu-deps/setup.sh 2>&1 | tail -40

      - name: 补 availability.pl 到 Xcode SDK（generate_aliases 需要它）
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          sudo mkdir -p "$SDK/usr/local/libexec"
          sudo cp xnu-deps/AvailabilityVersions/availability.pl "$SDK/usr/local/libexec/"
          ls -la "$SDK/usr/local/libexec/availability.pl"

      - name: 在 macOS 上把 xnu-clang 做成直通 Xcode clang
        run: |
          mkdir -p xnu-deps/host/bin
          cat > xnu-deps/host/bin/xnu-clang <<'SH'
          #!/bin/bash
          exec xcrun --sdk iphoneos clang "$@"
          SH
          cat > xnu-deps/host/bin/xnu-clang++ <<'SH'
          #!/bin/bash
          exec xcrun --sdk iphoneos clang++ "$@"
          SH
          chmod +x xnu-deps/host/bin/xnu-clang xnu-deps/host/bin/xnu-clang++
          PATH="$PWD/xnu-deps/host/bin:$PATH" xnu-clang --version | head -2

      - name: 编内核（arm64e）
        env:
          XNU_SRC: ${{ github.workspace }}/xnu-src
          RC_DARWIN_KERNEL_VERSION: 12377.121.6
          XNU_ARCH: arm64e
          MACHINE: BCM2837
        run: |
          set -o pipefail
          bash xnu-build.sh -j"$(sysctl -n hw.ncpu)" -k > build.log 2>&1 || true
          echo "---- 错误（前 40 条）----"
          grep -nE "error:" build.log | head -40 || true
          echo "---- 日志尾部 ----"
          tail -30 build.log || true
          echo "---- 产物 ----"
          ls -la xnu-src/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/ | head -20 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mach.development.bcm2837
          path: |
            xnu-src/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
            xnu-src/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped
            build.log
          if-no-files-found: warn