name: build-miro-kernel

on:
  # 内核已在 Linux 上编出来了，这里只保留手动触发，避免每次 push 白烧 macOS 额度
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kernel:
    # macOS runner: 这里要的就是 Xcode 自带的 cctools/mig/SDK —— Linux 上卡住的那几样
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode（要带 iPhoneOS 26 SDK 的那版）
        run: |
          echo "可用的 Xcode："
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          echo "当前："; xcodebuild -version; xcodebuild -showsdks | grep -iE "iphoneos" || true
          # 如果默认 Xcode 太旧、没有 iphoneos26，就切到最新的那个
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$LATEST" ] && sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: 下载 XNU 12377.121.6
        run: |
          curl -L --retry 3 -o /tmp/xnu.tar.gz \
            https://github.com/apple-oss-distributions/xnu/archive/refs/tags/xnu-12377.121.6.tar.gz
          mkdir -p xnu-src
          tar xzf /tmp/xnu.tar.gz -C xnu-src --strip-components=1

      - name: 打 dada 补丁 + 触摸固件头
        run: |
          cd xnu-src
          git init -q
          git add -A
          git -c user.email=ci@example.com -c user.name=ci commit -qm upstream
          git apply --whitespace=nowarn ../kernel/xnu-12377.121.6-dada.patch
          cp ../focaltech/redwood_focaltech_fw.h bsd/dev/
          echo "补丁已打"

      - name: 修 config 里的 /dev/null（kextsymboltool 需要可寻址的输出）
        run: |
          cd xnu-src
          sed -i '' 's|-output /dev/null|-output $(OBJPATH)/export-check.out|g' config/Makefile
          grep -n "export-check.out" config/Makefile | head -3

      - name: 补 availability.pl 到所有 iPhoneOS SDK（generate_aliases 需要它）
        run: |
          set -x
          for sdk in /Applications/Xcode*.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS*.sdk; do
            [ -d "$sdk" ] || continue
            sudo mkdir -p "$sdk/usr/local/libexec"
            sudo cp xnu-deps/AvailabilityVersions/availability.pl "$sdk/usr/local/libexec/availability.pl"
            sudo chmod 755 "$sdk/usr/local/libexec/availability.pl"
            ls -l "$sdk/usr/local/libexec/availability.pl"
          done
          echo "xcrun 报的 SDK：$(xcrun --sdk iphoneos --show-sdk-path 2>&1 || true)"

      - name: 在 macOS 上把 xnu-clang 做成直通 Xcode clang
        run: |
          mkdir -p xnu-deps/host/bin
          cat > xnu-deps/host/bin/xnu-clang <<'SH'
          #!/bin/bash
          exec xcrun --sdk iphoneos clang -DXNU_NO_TYPE_BUILTINS=1 "$@"
          SH
          cat > xnu-deps/host/bin/xnu-clang++ <<'SH'
          #!/bin/bash
          exec xcrun --sdk iphoneos clang++ -DXNU_NO_TYPE_BUILTINS=1 "$@"
          SH
          chmod +x xnu-deps/host/bin/xnu-clang xnu-deps/host/bin/xnu-clang++
          PATH="$PWD/xnu-deps/host/bin:$PATH" xnu-clang --version | head -2

      - name: 装 unifdef / csh（setup 生成 firehose 头要用）
        run: |
          brew install unifdef csh 2>&1 | tail -3 || true
          which unifdef || echo "unifdef 还是没有"
      - name: 覆盖补丁缺失的源文件（miro 的 nw_wifi_* 桩）
        run: |
          cp -v xnu-overlay/bsd/dev/hakios_dada_wlan.c xnu-src/bsd/dev/hakios_dada_wlan.c
          grep -c "nw_wifi_scan(const uint8_t" xnu-src/bsd/dev/hakios_dada_wlan.c

      - name: 准备依赖（macOS 走 Xcode 的 cctools/mig，不用 theos）
        env:
          XNU_SRC: ${{ github.workspace }}/xnu-src
          RC_DARWIN_KERNEL_VERSION: 12377.121.6
          XNU_ARCH: arm64e
          MACHINE: BCM2837
        run: |
          chmod +x xnu-deps/setup.sh xnu-build.sh
          bash xnu-deps/setup.sh 2>&1 | tail -40

      - name: 把 setup 生成的 usr/local 同步进 Xcode SDK（firehose 头在这里）
        env:
          XNU_SRC: ${{ github.workspace }}/xnu-src
          RC_DARWIN_KERNEL_VERSION: 12377.121.6
          XNU_ARCH: arm64e
          MACHINE: BCM2837
        run: |
          set -x
          # 必须用 Apple clang 现编：Linux 编的库会把 kext 里的函数指针签名成
          # 另一套修饰符，内核 pthread_init -> pthread_functions->pthread_init 会 FPAC
          # 导出的头（EXPORT_HDRS）在 unifdef 时把 XNU_KERNEL_PRIVATE 段剥掉了，
          # 但声明还在 -> 编 firehose/pthread 库时会报 unknown type name。
          # 这里把缺的私有宏补回去（只补这几行，不动其它内容）。
          H=xnu-src/BUILD/obj/EXPORT_HDRS/osfmk/kern/lock_rw.h
          if [ -f "$H" ] && ! grep -q "define __lck_rw_other_extern" "$H"; then
            echo "补 EXPORT_HDRS 里被剥离的私有宏"
            { printf '#ifndef __LCK_RW_EXPORT_FIX\n#define __LCK_RW_EXPORT_FIX\n#define __lck_rw_other_extern   extern __attribute__((overloadable))\n#define __lck_rw_new_func       __attribute__((overloadable))\n#define __lck_rw_old_func\n#define __enum_closed_decl(name, type, ...) enum name : type __VA_ARGS__\n#define __enum_open_decl(name, type, ...) enum name : type __VA_ARGS__\n#endif\n'; cat "$H"; } > "$H.new"
            mv "$H.new" "$H"
            grep -c "define __lck_rw_other_extern" "$H"
          fi
          bash xnu-deps/setup.sh --rebuild-libs 2>&1 | tail -15 || true
          L=xnu-deps/sdk/iPhoneOS26.5.xnu.sdk/usr/local/lib/kernel
          mkdir -p "$L"
          if [ ! -f "$L/libpthread_kext.a" ] || [ ! -f "$L/libfirehose_kernel.a" ]; then
            echo "::error::现编 kext 库失败，用的是 Linux 编的库，内核会在 pthread_init 处 FPAC"
            exit 1
          fi
          ls -l "$L"

          SRC=$(ls -d xnu-deps/sdk/*/ | head -1)
          XS=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SRC=$SRC"; echo "XS=$XS"
          ls -R "$SRC/usr/local/include" | head -20 || true
          sudo mkdir -p "$XS/usr/local"
          sudo cp -R "$SRC/usr/local/." "$XS/usr/local/" || true
          sudo chmod 755 "$XS/usr/local/libexec/availability.pl" || true
          ls -l "$XS/usr/local/include/kernel/os/" | head -10 || true

      - name: 编内核（arm64e）
        env:
          XNU_SRC: ${{ github.workspace }}/xnu-src
          RC_DARWIN_KERNEL_VERSION: 12377.121.6
          XNU_ARCH: arm64e
          MACHINE: BCM2837
        run: |
          set -o pipefail
          bash xnu-build.sh -j"$(sysctl -n hw.ncpu)" -k > build.log 2>&1 || true
          echo "---- exporthdrs 日志（尾 40 行）----"
          tail -40 xnu-deps/exporthdrs.log 2>/dev/null || echo "(没有 exporthdrs.log)"
          echo "---- 错误种类（去重）----"
          grep -oE "error: [^\"]{0,90}" build.log | sed -E 's/[0-9]+/N/g' | sort | uniq -c | sort -rn | head -30 || true
          echo "---- 错误（前 60 条原文）----"
          grep -nE "error:" build.log | head -60 || true
          echo "---- 日志尾部 ----"
          tail -30 build.log || true
          echo "---- 产物 ----"
          ls -la xnu-src/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/ | head -20 || true

      - name: 内核传到 release（artifact 配额已满，走 release 资产）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          K=xnu-src/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          if [ -f "$K" ]; then
            TAG=kernel-builds
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" -t "kernel builds" -n "自动上传的 arm64e 内核" || true
            cp "$K" mach.development.bcm2837.arm64e
            shasum -a 256 mach.development.bcm2837.arm64e | tee kernel.sha256
            gh release upload "$TAG" mach.development.bcm2837.arm64e kernel.sha256 --clobber
            # 再传一份 7MB 分片：某些网络对单次响应有 20MB 上限，整包下不动时用分片
            rm -f part.*; split -b 7000000 mach.development.bcm2837.arm64e part.
            ls -l part.*
            gh release upload "$TAG" part.* --clobber
          else
            echo "没有内核产物，跳过"; ls -la xnu-src/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/ | head -5 || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mach.development.bcm2837
          path: |
            xnu-src/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
            xnu-src/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped
            build.log
          if-no-files-found: warn
